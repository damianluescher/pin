<!doctype html><link rel=stylesheet href=common.css><style>
/* B COCKPIT: Cron. Warm black, big white type, one vivid orange for what needs you. Left rail is a filmstrip of real thumbnails; comments are a queue. */
body{background:#0f0d0a;color:#fff;font:15px/1.5 "Helvetica Neue"}
.rail{position:absolute;left:0;top:0;bottom:0;width:176px;background:#161412;padding:48px 16px 16px;overflow:hidden}
.t{font-weight:700;font-size:22px;letter-spacing:-.02em;margin-bottom:16px}
.th{margin-bottom:14px;color:#ccc;font-size:13px}.th img{width:100%;border-radius:4px;display:block;margin-bottom:4px}.th.on{color:#fff}.th.on img{outline:2px solid #ff4700;outline-offset:2px}
.can{position:absolute;left:176px;right:340px;top:0;bottom:0;background:#0f0d0a}
.q{position:absolute;right:0;top:0;bottom:0;width:340px;background:#161412;padding:48px 20px}
.big{font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.03em}.sub{color:#ccc;font-size:13px;margin:8px 0 24px}
.c{padding:14px 0;border-top:1px solid #2a2622}.c.on{background:#ff4700;color:#000;margin:0 -20px;padding:14px 20px;border:0}
.c small{display:block;font-size:13px;opacity:.7}.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50% 50% 50% 4px;background:#ff4700;color:#000;font-weight:700;font-size:13px;line-height:30px;text-align:center}
.keys{position:absolute;bottom:20px;left:20px;right:20px;display:flex;gap:6px}.keys b{background:#ff4700;color:#000;border-radius:4px;padding:6px 12px;font-size:13px}.keys span{background:#2a2622;border-radius:4px;padding:6px 12px;font-size:13px}
.tl{position:absolute;left:16px;top:18px;display:flex;gap:8px}.tl i{width:12px;height:12px;background:#3a3531;border-radius:50%}
</style><div class=rail><div class=t>10</div>
